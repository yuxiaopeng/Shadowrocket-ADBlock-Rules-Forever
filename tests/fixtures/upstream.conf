# Fixture upstream config

[General]
ipv6 = false
bypass-system = true
skip-proxy = localhost, *.local
bypass-tun = 10.0.0.0/8
dns-server = https://dns.example/dns-query

[Rule]
# Upstream comment must survive.
DOMAIN-SUFFIX,bybit.com,Proxy
DOMAIN-SUFFIX, duplicate.example, Proxy
DOMAIN-SUFFIX,duplicate.example,Proxy
# Duplicate-adjacent comment must survive.
DOMAIN-SUFFIX,duplicate.example,DIRECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/AppleNews/AppleNews.list,PROXY
FINAL,direct

[URL Rewrite]
^https?://example\.cn https://example.com 302

[MITM]
hostname = *.google.cn
# Footer must survive.
