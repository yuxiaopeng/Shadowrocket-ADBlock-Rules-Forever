# Fixture upstream config

[General]
ipv6 = false
prefer-ipv6 = true
bypass-system = true
skip-proxy = localhost, WWW.BAIDU.COM, www.baidu.com
always-real-ip = upstream.example, ID6.ME
dns-server = https://dns.example/dns-query

[Rule]
# Upstream comment must survive.
DOMAIN-SUFFIX,bybit.com,DIRECT
DOMAIN-SUFFIX, Duplicate.Example, Proxy
# Duplicate-adjacent comment must survive.
DOMAIN-SUFFIX,duplicate.example,DIRECT
DOMAIN-SUFFIX,modifier.example,Proxy,no-resolve
DOMAIN-SUFFIX,modifier.example,DIRECT,pre-matching
AND,((DOMAIN-SUFFIX,GOOGLEVIDEO.COM), (PROTOCOL,UDP)),Proxy
RULE-SET,https://example.com/rules.list,Proxy
FUTURE-RULE,value,Proxy
FUTURE-RULE,value,Proxy
FUTURE-RULE,value,DIRECT
YouTube去广告 = type=http-request,pattern=old
FINAL,Proxy
# Comment after FINAL must move before it.

[URL Rewrite]
^https?://custom\.example https://old.example 302
^https?://duplicate\.example https://first.example 302
^https?://duplicate\.example https://second.example 302
# Rewrite footer survives.

[MITM]
hostname = *.GOOGLE.CN, upstream.example
# Footer must survive.
enable = false
