name: Sync upstream to my-rules

on:
  push:
    branches:
      - release
    paths:
      - ".github/workflows/sync-upstream-to-my-rules.yml"
  schedule:
    # GitHub Actions cannot be triggered directly by another repository's push,
    # so this polls upstream every 6 hours and exits cleanly when nothing changed.
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-to-my-rules
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Johnshall/Shadowrocket-ADBlock-Rules-Forever
  UPSTREAM_BRANCH: release
  UPSTREAM_HISTORY_BRANCH: upstream-release-history
  TARGET_BRANCH: my-rules

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and local branches
        run: |
          set -euo pipefail

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"
          git fetch --no-tags origin "+refs/heads/${UPSTREAM_HISTORY_BRANCH}:refs/remotes/origin/${UPSTREAM_HISTORY_BRANCH}" || true
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}" || true

      - name: Update upstream history branch
        run: |
          set -euo pipefail

          upstream_ref="upstream/${UPSTREAM_BRANCH}"
          upstream_sha="$(git rev-parse "${upstream_ref}")"

          if git show-ref --verify --quiet "refs/remotes/origin/${UPSTREAM_HISTORY_BRANCH}"; then
            git checkout -B "${UPSTREAM_HISTORY_BRANCH}" "origin/${UPSTREAM_HISTORY_BRANCH}"
          else
            git checkout --orphan "${UPSTREAM_HISTORY_BRANCH}"
            git rm -rf . >/dev/null 2>&1 || true
            git clean -fdx >/dev/null 2>&1
          fi

          if git rev-parse --verify HEAD >/dev/null 2>&1 && git diff --quiet HEAD "${upstream_ref}" --; then
            echo "Upstream tree is already tracked at ${upstream_sha}."
            exit 0
          fi

          git read-tree --reset -u "${upstream_ref}"
          git commit -m "Sync upstream release ${upstream_sha}"
          git push origin "HEAD:${UPSTREAM_HISTORY_BRANCH}"

      - name: Merge upstream history into my-rules
        run: |
          set -euo pipefail

          git fetch --no-tags origin "+refs/heads/${UPSTREAM_HISTORY_BRANCH}:refs/remotes/origin/${UPSTREAM_HISTORY_BRANCH}"

          if git show-ref --verify --quiet "refs/remotes/origin/${TARGET_BRANCH}"; then
            git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          else
            git checkout -B "${TARGET_BRANCH}" "origin/${UPSTREAM_HISTORY_BRANCH}"
            git push -u origin "HEAD:${TARGET_BRANCH}"
            echo "Created ${TARGET_BRANCH} from ${UPSTREAM_HISTORY_BRANCH}."
            exit 0
          fi

          if git merge-base --is-ancestor "origin/${UPSTREAM_HISTORY_BRANCH}" HEAD; then
            echo "${TARGET_BRANCH} already contains the latest upstream history."
            exit 0
          fi

          # Apply upstream changes while preserving custom my-rules edits when
          # both sides changed the same generated rule lines.
          git merge --no-edit -X ours "origin/${UPSTREAM_HISTORY_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"
