name: Sync upstream to my-rules

on:
  push:
    branches:
      - release
    paths:
      - ".github/workflows/sync-upstream-to-my-rules.yml"
      - ".github/workflows/test-my-rules-renderer.yml"
      - "automation/my-rules/**"
      - "scripts/render_my_rules.py"
      - "tests/**"
  schedule:
    # GitHub Actions cannot be triggered directly by another repository's push,
    # so this polls upstream every 6 hours and exits cleanly when nothing changed.
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-to-my-rules
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Johnshall/Shadowrocket-ADBlock-Rules-Forever
  UPSTREAM_BRANCH: release
  TARGET_BRANCH: my-rules
  TARGET_FILE: sr_top500_banlist_ad.conf
  STATE_FILE: .my-rules-sync-state.json
  OVERLAY_FILE: automation/my-rules/sr_top500_banlist_ad/overlay.toml

jobs:
  sync:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout control files
        uses: actions/checkout@v6
        with:
          ref: release
          path: control
          persist-credentials: false

      - name: Test renderer
        run: python3 -m unittest discover -s control/tests -v

      - name: Checkout upstream rules
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_BRANCH }}
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout my-rules
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: target
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record source revisions
        run: |
          set -euo pipefail

          echo "UPSTREAM_SHA=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "TARGET_START_SHA=$(git -C target rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify current target provenance
        run: |
          set -euo pipefail

          if [[ -f "target/${STATE_FILE}" ]]; then
            python3 control/scripts/render_my_rules.py verify-state \
              --output "target/${TARGET_FILE}" \
              --state "target/${STATE_FILE}"
          else
            python3 control/scripts/render_my_rules.py validate-history \
              --repository target \
              --tip HEAD
          fi

      - name: Rebuild my-rules from upstream
        run: |
          set -euo pipefail

          python3 control/scripts/render_my_rules.py render \
            --input "upstream/${TARGET_FILE}" \
            --output "target/${TARGET_FILE}" \
            --state "target/${STATE_FILE}" \
            --overlay "control/${OVERLAY_FILE}" \
            --upstream-commit "${UPSTREAM_SHA}"

          python3 control/scripts/render_my_rules.py check \
            --input "upstream/${TARGET_FILE}" \
            --output "target/${TARGET_FILE}" \
            --overlay "control/${OVERLAY_FILE}"

          # Reapplying the overlay to its own output must be a byte-for-byte no-op.
          python3 control/scripts/render_my_rules.py check \
            --input "target/${TARGET_FILE}" \
            --output "target/${TARGET_FILE}" \
            --overlay "control/${OVERLAY_FILE}"

      - name: Verify change scope
        run: |
          set -euo pipefail

          while IFS= read -r path; do
            case "${path}" in
              "${TARGET_FILE}"|"${STATE_FILE}") ;;
              *)
                echo "Unexpected target change: ${path}" >&2
                exit 1
                ;;
            esac
          done < <(git -C target status --porcelain=v1 --untracked-files=all | cut -c4-)

      - name: Commit and push rebuilt rules
        run: |
          set -euo pipefail

          git -C target config user.name "github-actions[bot]"
          git -C target config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C target add -- "${TARGET_FILE}" "${STATE_FILE}"

          if git -C target diff --cached --quiet; then
            echo "my-rules already matches upstream ${UPSTREAM_SHA}."
            exit 0
          fi

          git -C target commit \
            -m "sync(my-rules): rebuild from upstream ${UPSTREAM_SHA:0:12}" \
            -m "Upstream-Commit: ${UPSTREAM_SHA}"

          git -C target fetch --no-tags origin "refs/heads/${TARGET_BRANCH}"
          remote_sha="$(git -C target rev-parse FETCH_HEAD)"
          if [[ "${remote_sha}" != "${TARGET_START_SHA}" ]]; then
            echo "${TARGET_BRANCH} advanced from ${TARGET_START_SHA} to ${remote_sha}; refusing to overwrite it." >&2
            exit 1
          fi

          git -C target push origin "HEAD:refs/heads/${TARGET_BRANCH}"
